    elems:JSON.parse(JSON.stringify(elems)),
    backdropX:backdrop.x,backdropY:backdrop.y,
    pipeX:pipeTruss.x,pipeY:pipeTruss.y
  };
  undoStack.push(state);
  if(undoStack.length>MAX_UNDO)undoStack.shift();
}

  if(undoStack.length===0)return;
  var state=undoStack.pop();
  tables=state.tables;
  clientTables=state.clientTables;
  screens=state.screens;
  elems=state.elems;
  backdrop.x=state.backdropX;backdrop.y=state.backdropY;

}

// Face toward: calculate angle so the "open" side of crescent faces target
function chairSpacing(){
  // Calculate distance between chair centers in inches
  var rIn=cfg.tableDiam/2; // table radius in inches
  var cR=cfg.chairSizeIn/2; // chair radius in inches
  var ringR=rIn+cR+cfg.chairGapIn; // ring radius where chair centers sit (inches, +2in gap)
  var n=cfg.chairsPerTable;
  if(n<2)return 0;
  if(cfg.tableShape==="crescent"){
    // Chairs on ~82% of circle
    var arcSpan=Math.PI*0.82;
    var arcPerChair=arcSpan/n;
    return 2*ringR*Math.sin(arcPerChair/2);
  }else if(cfg.tableShape==="round"){
    // Full circle
    var arcPerChair2=2*Math.PI/n;
    return 2*ringR*Math.sin(arcPerChair2/2);
  }else{
    // Rectangular: approximate along long side
    var longSide=Math.max(cfg.rectTableW*12,cfg.rectTableD);
    var perSide=Math.floor(n/2);
    if(perSide<2)return longSide;
    return longSide/(perSide-1);
  }
}

function facingForWall(){
  // All tables face the same direction: chairs (+Y local) toward stage wall
  // rotate(0) = chairs point down (+Y screen). So:
  // stage top: chairs face up = rotate(180)
  // stage bottom: chairs face down = rotate(0)
  // stage left: chairs face left = rotate(90)  
  // stage right: chairs face right = rotate(270)
  var map={top:180,bottom:0,left:90,right:270};
  return map[cfg.stageWall]||0;
}
function faceToward(obj,target){
  // Per-object angle toward a specific point (used for individual rotate-toward)
  var dx=target.x-obj.x, dy=target.y-obj.y;
  if(Math.abs(dx)<0.01&&Math.abs(dy)<0.01)return facingForWall();
  var r = Math.atan2(-dx, dy) * 180 / Math.PI;
  return ((Math.round(r/15)*15) % 360 + 360) % 360;
}

function detectHotelWallsFromPdf(callback){
  if(!pdfBg || !pdfPageW || !pdfPageH){ if(callback) callback(false); return; }
  var img = new Image();
  img.onload = function(){
    var c = document.createElement("canvas");
    c.width = pdfPageW; c.height = pdfPageH;
    var ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,pdfPageW,pdfPageH);
    var data = ctx.getImageData(0,0,pdfPageW,pdfPageH).data;

    function darkAt(x,y){
      var i=(y*pdfPageW+x)*4;
      var r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
      if(a<20) return 0;
      var lum=0.2126*r+0.7152*g+0.0722*b;
      return lum < 170 ? 1 : 0;
    }

    var rowScores=new Array(pdfPageH).fill(0);
    var colScores=new Array(pdfPageW).fill(0);
    for(var y=0;y<pdfPageH;y++){
      var rs=0;
      for(var x=0;x<pdfPageW;x++) rs += darkAt(x,y);
      rowScores[y]=rs;
    }
    for(var x=0;x<pdfPageW;x++){
      var cs=0;
      for(var y=0;y<pdfPageH;y++) cs += darkAt(x,y);
      colScores[x]=cs;
    }

    var rowThresh=Math.max(20, Math.max.apply(null,rowScores)*0.35);
    var colThresh=Math.max(20, Math.max.apply(null,colScores)*0.35);

    var yStart=Math.floor(pdfPageH*0.03), yEnd=Math.floor(pdfPageH*0.97);
    var xStart=Math.floor(pdfPageW*0.03), xEnd=Math.floor(pdfPageW*0.97);

    var top=yStart, bottom=yEnd, left=xStart, right=xEnd;
    for(var y=yStart;y<yEnd;y++){ if(rowScores[y]>=rowThresh){ top=y; break; } }
    for(var y=yEnd;y>=yStart;y--){ if(rowScores[y]>=rowThresh){ bottom=y; break; } }
    for(var x=xStart;x<xEnd;x++){ if(colScores[x]>=colThresh){ left=x; break; } }
    for(var x=xEnd;x>=xStart;x--){ if(colScores[x]>=colThresh){ right=x; break; } }

    if(right-left < pdfPageW*0.25 || bottom-top < pdfPageH*0.18){
      pdfWallBox = null;
      if(callback) callback(false);
      return;
    }

    pdfWallBox = {x:left, y:top, w:right-left, h:bottom-top};
    if(callback) callback(true);
  };
  img.onerror = function(){ if(callback) callback(false); };
  img.src = pdfBg;
}

function redistributeTables(){
  if(tables.length<1)return;snapshot();
  var m=met(),sr=sRect(),w=cfg.stageWall,sp=cfg.tableSpacing*PX;
  var n=tables.length;
  // Use manual cols/rows if set, otherwise auto square
  var cols,rows;
  if(cfg.tableCols>0&&cfg.tableRows>0){
    cols=cfg.tableCols;rows=cfg.tableRows;
    // If user set fewer slots than tables, expand rows
    while(cols*rows<n)rows++;
  }else if(cfg.tableCols>0){
    cols=cfg.tableCols;rows=Math.ceil(n/cols);
  }else if(cfg.tableRows>0){
    rows=cfg.tableRows;cols=Math.ceil(n/rows);
  }else{
    cols=Math.ceil(Math.sqrt(n));rows=Math.ceil(n/cols);
  }
  // Update config display values
  cfg.tableCols=cols;cfg.tableRows=rows;
  // Available area opposite the stage
  var aX,aY,aW,aH;
  if(w==="top"){aX=m.rX;aY=sr.y+sr.h+30;aW=m.rW;aH=m.rY+m.rH-sr.y-sr.h-40}
  else if(w==="bottom"){aX=m.rX;aY=m.rY+10;aW=m.rW;aH=sr.y-m.rY-40}
  else if(w==="left"){aX=sr.x+sr.w+30;aY=m.rY;aW=m.rX+m.rW-sr.x-sr.w-40;aH=m.rH}
  else{aX=m.rX+10;aY=m.rY;aW=sr.x-m.rX-40;aH=m.rH}
  var cellW=Math.max(sp,40);
  var cellH=Math.max(sp,40);
  var gridW=cellW*(cols-1);
  var gridH=cellH*(rows-1);
  var startX=aX+(aW-gridW)/2;
  var startY=aY+(aH-gridH)/2;
  var sf=sFront();
  for(var i=0;i<n;i++){
    var row=Math.floor(i/cols);
    var col=i%cols;
    // Count items in this row
    var rowStart=row*cols;
    var itemsThisRow=Math.min(cols,n-rowStart);
    // Center this row if it has fewer items
    var rowGridW=cellW*(itemsThisRow-1);
    var rowOffX=aX+(aW-rowGridW)/2;
    tables[i].x=rowOffX+col*cellW;
    tables[i].y=startY+row*cellH;
    if(tables[i].facing===undefined||tables[i].facing===null)tables[i].facing=facingForWall();
    tables[i].label=""+(i+1);
  }
  render();
}

function applyCustomLayout(){
  if(customLayout.length===0)return;
  snapshot();
  tables=[];
  var m=met(),sr=sRect(),w=cfg.stageWall,sp=cfg.tableSpacing*PX;
  // Available area
  var aX,aY,aW,aH;
  if(w==="top"){aX=m.rX;aY=sr.y+sr.h+30;aW=m.rW;aH=m.rY+m.rH-sr.y-sr.h-40}
  else if(w==="bottom"){aX=m.rX;aY=m.rY+10;aW=m.rW;aH=sr.y-m.rY-40}
  else if(w==="left"){aX=sr.x+sr.w+30;aY=m.rY;aW=m.rX+m.rW-sr.x-sr.w-40;aH=m.rH}
  else{aX=m.rX+10;aY=m.rY;aW=sr.x-m.rX-40;aH=m.rH}
  var totalRows=customLayout.length;
  var rowH=Math.max(sp,aH/(totalRows+1));
  var face=facingForWall();
  var num=1;
  for(var ri=0;ri<totalRows;ri++){
    var cols=customLayout[ri];
    if(cols<1)continue;
    var colW=Math.max(sp,aW/(cols+1));
    // Center this row
    var rowW=colW*(cols-1);
    var rowStartX=aX+(aW-rowW)/2;
    var rowY=aY+rowH*(ri+1);
    for(var ci2=0;ci2<cols;ci2++){
      tables.push({id:uid(),x:rowStartX+colW*ci2,y:rowY,label:""+num,facing:face});
      num++;
    }
  }
  // Update cfg to reflect
  cfg.tableRows=totalRows;
  cfg.tableCols=Math.max.apply(null,customLayout);
  render();
}

function parseCustomLayout(text){
  customLayoutText=text;
  customLayout=[];
  // Parse formats: "5,6,5" or "5-6-5" or "5 6 5" or multiline
  var parts=text.replace(/[\n\r]+/g,",").replace(/[\-\/|]+/g,",").split(",");
  for(var pi=0;pi<parts.length;pi++){
    var v=parseInt(parts[pi].trim());
    if(!isNaN(v)&&v>0)customLayout.push(v);
  }
  return customLayout;
}

function snapScreensStageWallCenter(){
  // Snap screens centered between stage edges and room walls (L/R)
  snapshot();
  var sr2=sRect(),w2=cfg.stageWall,m2=met();
  if(w2==="top"||w2==="bottom"){
    // Left screen: centered between left wall and left edge of stage
    // Right screen: centered between right edge of stage and right wall
    var stageLeft=sr2.x;
    var stageRight=sr2.x+sr2.w;
    var roomLeft=m2.rX;
    var roomRight=m2.rX+m2.rW;
    if(screens.length===1){
      // Single screen: center on stage
      screens[0].x=sr2.x+sr2.w/2;
    }else if(screens.length===2){
      screens[0].x=(roomLeft+stageLeft)/2;
      screens[1].x=(stageRight+roomRight)/2;
    }else{
      // First goes between left wall and stage
      screens[0].x=(roomLeft+stageLeft)/2;
      // Last goes between stage and right wall
      screens[screens.length-1].x=(stageRight+roomRight)/2;
      // Middle ones evenly across stage width
      for(var si3=1;si3<screens.length-1;si3++){
        var sp5=sr2.w/(screens.length-2+1);
        screens[si3].x=sr2.x+sp5*si3;
      }
    }
    // Y position: same row, at stage front
    var sy2=w2==="top"?sr2.y+sr2.h+20:sr2.y-20;
    for(var si4=0;si4<screens.length;si4++){screens[si4].y=sy2;}
  }else{
    // Left/right stage walls
    var stageTop=sr2.y;
    var stageBot=sr2.y+sr2.h;
    var roomTop=m2.rY;
    var roomBot=m2.rY+m2.rH;
    if(screens.length===1){
      screens[0].y=sr2.y+sr2.h/2;
    }else if(screens.length===2){
      screens[0].y=(roomTop+stageTop)/2;
      screens[1].y=(stageBot+roomBot)/2;
    }else{
      screens[0].y=(roomTop+stageTop)/2;
      screens[screens.length-1].y=(stageBot+roomBot)/2;
      for(var si5=1;si5<screens.length-1;si5++){
        var sp6=sr2.h/(screens.length-2+1);
        screens[si5].y=sr2.y+sp6*si5;
      }
    }
    var sx2=w2==="left"?sr2.x+sr2.w+20:sr2.x-20;
    for(var si6=0;si6<screens.length;si6++){screens[si6].x=sx2;}
  }
  render();
}

function svgPt(e){var svg=$("#cad"),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}

$("#cad").addEventListener("click",function(e){
  if(e.target.closest("[data-d]"))return;
  var p=svgPt(e);
  if(mode==="placeTable"){snapshot();var sf=sFront();tables.push({id:uid(),x:p.x,y:p.y,label:""+(tables.length+1),facing:facingForWall()});render()}
  else if(mode==="placeClient"){snapshot();var sf2=sFront();clientTables.push({id:"cli_"+uid(),x:p.x,y:p.y,facing:facingForWall()});render()}
  else if(mode==="placeElem"){
    if(isDrapeType(placingElemType)){
      // Start drape drag - place it and we'll stretch on mousemove
      placeElemAt(p.x,p.y);
      var lastEl=elems[elems.length-1];
      if(lastEl)drawingDrape={id:lastEl.id,startX:p.x,startY:p.y};
    }else{placeElemAt(p.x,p.y)}
  }
  else if(mode==="measure1"){measurePt1={x:p.x,y:p.y};mode="measure2";render()}
  else if(mode==="measure2"){measurePt2={x:p.x,y:p.y};measuredLines.push({a:{x:measurePt1.x,y:measurePt1.y},b:{x:measurePt2.x,y:measurePt2.y}});mode="select";render()}
  else{clearSel();render()}
});

// MOUSEDOWN: select or start drag. Shift+click = multi-select.
$("#cad").addEventListener("mousedown",function(e){
  var g=e.target.closest("[data-d]");if(!g||mode!=="select")return;
  e.preventDefault();e.stopPropagation();
  var id=g.getAttribute("data-d"),tp=g.getAttribute("data-tp")||"table",p=svgPt(e);
  var obj=getObj(id,tp);if(!obj)return;

  if(e.shiftKey){
    // Toggle in selection
    if(isSel(id)){selection=selection.filter(function(s){return s.id!==id})}
    else{selection.push({id:id,tp:tp})}
    render();return;
  }

  // If clicking an already-selected item, start multi-drag
  if(isSel(id)&&selection.length>1){
    snapshot();dragId=id;dragType=tp;dragMulti=true;
    multiOffsets=[];
    selection.forEach(function(s){
      var o=getObj(s.id,s.tp);if(o){multiOffsets.push({id:s.id,tp:s.tp,dx:o.x-p.x,dy:o.y-p.y})}
    });
    render();return;
  }

  // Single select
  clearSel();selection.push({id:id,tp:tp});
  snapshot();dragId=id;dragType=tp;dragMulti=false;dragOff={x:p.x-obj.x,y:p.y-obj.y};
  render();
});

$("#cad").addEventListener("mousemove",function(e){
  if(!dragId)return;var p=svgPt(e);
  if(drawingDrape){
    var drEl=null;for(var dri=0;dri<elems.length;dri++){if(elems[dri].id===drawingDrape.id){drEl=elems[dri];break}}
    if(drEl){
      var dx2=p.x-drawingDrape.startX,dy2=p.y-drawingDrape.startY;
      var dist2=Math.sqrt(dx2*dx2+dy2*dy2);
      drEl.w=Math.max(10,dist2);
      // Set rotation to follow drag direction
      drEl.rot=Math.atan2(dy2,dx2)*180/Math.PI;
      // Center between start and current
      drEl.x=(drawingDrape.startX+p.x)/2;
      drEl.y=(drawingDrape.startY+p.y)/2;
    }
    render();return;
  }
  if(dragMulti){
    multiOffsets.forEach(function(mo){
      var o=getObj(mo.id,mo.tp);if(o){o.x=p.x+mo.dx;o.y=p.y+mo.dy}
    });
  }else{
    var nx=p.x-dragOff.x,ny=p.y-dragOff.y;
    var obj=getObj(dragId,dragType);if(obj){obj.x=nx;obj.y=ny}
  }
  render();
});
$("#cad").addEventListener("mouseup",function(){dragId=null;dragMulti=false;multiOffsets=[];drawingDrape=null;});
$("#cad").addEventListener("mouseleave",function(){dragId=null;dragMulti=false;multiOffsets=[];drawingDrape=null;});

function crescSVG(x,y,d,ch,cR,lbl,isCl,sel,id,f){
  var r=(d/2/12)*PX;f=f||0;var fill=isCl?"#d6eaf8":"#f7f7f7",stk=sel?"#0066cc":"#333",sw=sel?2.5:1;
  var s='<g transform="translate('+x+","+y+") rotate("+f+')" data-d="'+id+'" data-tp="table" style="cursor:grab">';
  s+='<circle r="'+r+'" fill="'+fill+'" stroke="'+stk+'" stroke-width="'+sw+'"/>';
  var span=Math.PI*.82,ctr=Math.PI/2;
  for(var i=0;i<ch;i++){var t=ctr-span/2+span*(i+.5)/ch;s+='<circle cx="'+(Math.cos(t)*(r+cR+cfg.chairGapIn/12*PX))+'" cy="'+(Math.sin(t)*(r+cR+cfg.chairGapIn/12*PX))+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>'}
  s+='<polygon points="0,'+(-r+3)+" -3,"+(-r+8)+" 3,"+(-r+8)+'" fill="'+stk+'" opacity="0.4"/>';
  s+='<text y="2" text-anchor="middle" dominant-baseline="middle" fill="'+(isCl?"#1a5276":"#555")+'" font-size="'+(isCl?7:6)+'" font-weight="'+(isCl?800:500)+'" font-family="'+FF+'" style="pointer-events:none" transform="rotate('+(-f)+')">'+(isCl?"CLIENT":lbl)+"</text></g>";return s}

function roundSVG(x,y,d,ch,cR,lbl,isCl,sel,id,f){
  var r=(d/2/12)*PX;f=f||0;var fill=isCl?"#d6eaf8":"#f7f7f7",stk=sel?"#0066cc":"#333",sw=sel?2.5:1;
  var s='<g transform="translate('+x+","+y+") rotate("+f+')" data-d="'+id+'" data-tp="table" style="cursor:grab">';
  s+='<circle r="'+r+'" fill="'+fill+'" stroke="'+stk+'" stroke-width="'+sw+'"/>';
  for(var i=0;i<ch;i++){var a=(2*Math.PI*i)/ch-Math.PI/2;s+='<circle cx="'+(Math.cos(a)*(r+cR+cfg.chairGapIn/12*PX))+'" cy="'+(Math.sin(a)*(r+cR+cfg.chairGapIn/12*PX))+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>'}
  s+='<text y="2" text-anchor="middle" fill="'+(isCl?"#1a5276":"#555")+'" font-size="'+(isCl?7:6)+'" font-weight="'+(isCl?800:500)+'" font-family="'+FF+'" style="pointer-events:none" transform="rotate('+(-f)+')">'+(isCl?"CLIENT":lbl)+"</text></g>";return s}

function rectTSVG(x,y,w,d,lbl,sel,id,f){
  var pw=(w/12)*PX,pd=(d/12)*PX;f=f||0;
  var cR=(cfg.chairSizeIn/2/12)*PX;
  var nChairs=cfg.chairsPerTable;
  var stk=sel?"#0066cc":"#333",sw2=sel?2.5:1;
  var s='<g transform="translate('+x+","+y+") rotate("+f+')" data-d="'+id+'" data-tp="table" style="cursor:grab">';
  s+='<rect x="'+(-pw/2)+'" y="'+(-pd/2)+'" width="'+pw+'" height="'+pd+'" fill="#f7f7f7" stroke="'+stk+'" stroke-width="'+sw2+'"/>';
  // Distribute chairs: half on each long side, plus ends
  var longSide=pw>pd;
  var sideLen=longSide?pw:pd;
  var perSide=Math.floor(nChairs/2);
  var ends=nChairs-perSide*2;
  // Chairs along top edge (or left edge if portrait)
  for(var ci=0;ci<perSide;ci++){
    var t=(ci+0.5)/perSide;
    if(longSide){
      var cx2=-pw/2+t*pw, cy2=-pd/2-cR-cfg.chairGapIn/12*PX;
      s+='<circle cx="'+cx2+'" cy="'+cy2+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';
      // Bottom side
      s+='<circle cx="'+cx2+'" cy="'+(pd/2+cR+cfg.chairGapIn/12*PX)+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';
    }else{
      var cx3=-pw/2-cR-cfg.chairGapIn/12*PX, cy3=-pd/2+t*pd;
      s+='<circle cx="'+cx3+'" cy="'+cy3+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';
      s+='<circle cx="'+(pw/2+cR+cfg.chairGapIn/12*PX)+'" cy="'+cy3+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';
    }
  }
  // End chairs
  if(ends>=1){
    if(longSide){s+='<circle cx="'+(pw/2+cR+cfg.chairGapIn/12*PX)+'" cy="0" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';}
    else{s+='<circle cx="0" cy="'+(pd/2+cR+cfg.chairGapIn/12*PX)+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';}
  }
  if(ends>=2){
    if(longSide){s+='<circle cx="'+(-pw/2-cR-cfg.chairGapIn/12*PX)+'" cy="0" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';}
    else{s+='<circle cx="0" cy="'+(-pd/2-cR-cfg.chairGapIn/12*PX)+'" r="'+cR+'" fill="none" stroke="#555" stroke-width="0.7"/>';}
  }
  s+='<text y="2" text-anchor="middle" fill="#555" font-size="5" font-family="'+FF+'" style="pointer-events:none" transform="rotate('+(-f)+')">'+lbl+"</text></g>";return s}

function tblSVG(t,isCl){var id=t.id,sel=isSel(id),lbl=isCl?"CLIENT":t.label,f=t.facing||0,cR=(cfg.chairSizeIn/2/12)*PX;
